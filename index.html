<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agency Ticket Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script>
    // Supabase Configuration
    const SUPABASE_URL = 'https://kvjtcgkzojsykpxwxapd.supabase.co';
    
    // !!! PASTE YOUR PUBLISHABLE KEY HERE !!!
    const SUPABASE_ANON_KEY = 'sb_publishable_B2mPxNTQ5dcLz_m6J8jxPg_OpEtKGIh';
    
    let supabase;
    try {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch (err) {
      console.error("Supabase Init Error:", err);
    }
  </script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

  <!-- AUTH / LOGIN VIEW -->
  <div id="view-login" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-6 rounded-xl shadow-lg w-full max-w-sm border border-gray-200">
      <h1 class="text-xl font-bold text-center text-gray-900 mb-1">Agency Portal</h1>
      <p class="text-xs text-center text-gray-500 mb-6">Enter admin credentials to continue</p>
      
      <!-- THIS IS WHERE THE ERROR WILL SHOW UP -->
      <div id="login-error" class="hidden mb-4 text-xs font-bold text-red-700 bg-red-100 border border-red-300 p-3 rounded"></div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold mb-1">Email</label>
          <input id="login-email" type="email" placeholder="admin@agency.com" class="w-full border rounded-lg p-2 text-sm outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1">Password</label>
          <input id="login-password" type="password" placeholder="••••••••" class="w-full border rounded-lg p-2 text-sm outline-none">
        </div>
        <button onclick="handleLogin()" id="login-btn" class="w-full bg-blue-600 text-white font-medium py-2 rounded-lg text-sm">
          Secure Login
        </button>
      </div>
    </div>
  </div>

  <!-- MAIN APP VIEW (Hidden until login) -->
  <div id="view-app" class="hidden min-h-screen pb-16 flex items-center justify-center">
    <div class="p-6 text-center">
      <h2 class="text-2xl font-bold text-green-600 mb-2">Login Successful!</h2>
      <p class="text-gray-600">The connection to Supabase is working perfectly.</p>
    </div>
  </div>

  <script>
    async function handleLogin() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const errorDiv = document.getElementById('login-error');
      const btn = document.getElementById('login-btn');

      if (!supabase) {
        errorDiv.innerText = "System Error: Supabase failed to initialize. Check your API key format.";
        errorDiv.classList.remove('hidden');
        return;
      }

      try {
        btn.innerText = "Signing in...";
        errorDiv.classList.add('hidden');
        
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });

        if (error) {
          errorDiv.innerText = "Login Error: " + error.message;
          errorDiv.classList.remove('hidden');
          btn.innerText = "Secure Login";
        } else {
          document.getElementById('view-login').classList.add('hidden');
          document.getElementById('view-app').classList.remove('hidden');
        }
      } catch (err) {
        errorDiv.innerText = "Network/Crash Error: " + err.message;
        errorDiv.classList.remove('hidden');
        btn.innerText = "Secure Login";
      }
    }
  </script>
</body>
</html>
